<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .mark { color: #1F5F4A; }
    @media (prefers-color-scheme: dark) { .mark { color: #7FC4A8; } }
  </style>
  <!-- Maverich mark: one owned idea (filled core) inside an open ring -->
  <g class="mark">
    <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="70 12" transform="rotate(-70 16 16)"/>
    <circle cx="16" cy="16" r="6.5" fill="currentColor"/>
  </g>
</svg>
